# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.23.1
    - node@22.16.0
    - python@3.14.4
lint:
  ignore:
    - linters: [ALL]
      paths:
        - docs/**
        - examples/**
        - tools/**
  enabled:
    - terraform@1.1.0
    - semgrep@1.176.1
    - gitleaks@8.30.1
    - goimports@0.9.1
    - bandit@1.9.4
    - black@26.5.1
    - isort@9.0.1
    - ruff@0.16.6
    - actionlint@1.7.12
    - checkov@3.3.16
    - git-diff-check
    - gofmt@1.20.4
    - golangci-lint@2.13.2
    - markdownlint@0.49.1
    - osv-scanner@2.5.1
    - prettier@3.9.6
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - tflint@0.64.0
    - trivy@0.74.0
    - trufflehog@3.97.4
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-upgrade-available
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
